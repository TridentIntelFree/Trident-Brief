name: Analyst Desk

# The OSINT and analyst community on X over the last 48 hours, condensed once
# a day; see analyst_desk.py. Uses the GROK_API_KEY secret, nothing else.
# Written to data/analyst/, which the page shows only through a hidden gesture.
on:
  schedule:
    - cron: '13 12 * * *'      # 8:13 a.m. EDT / 7:13 a.m. EST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analyst-desk
  cancel-in-progress: false

jobs:
  desk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Build the analyst desk
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: python3 analyst_desk.py

      - name: Commit the desk
        run: |
          git config user.name "Trident Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analyst
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Analyst desk"
          for i in 1 2 3 4; do
            git push origin HEAD:main && break
            echo "Push failed (attempt $i); refreshing and retrying"
            git pull --rebase origin main || true
            sleep $((i * 4))
          done

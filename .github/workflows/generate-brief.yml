name: Generate Intelligence Brief

on:
  workflow_dispatch:
  schedule:
    # Twice daily: 11:04 and 23:04 UTC (7:04 am and pm EDT, 6:04 EST), a few
    # minutes off the hour, when most scheduled jobs pile in. GitHub has been
    # starting these hours late (the morning one around noon to 2 pm Eastern),
    # so the morning brief is started at 6:55 am Eastern by a daily Claude
    # routine on the owner's account (workflow_dispatch), and these stay as
    # the backup: the gate below skips a scheduled run if a brief was made in
    # the last 8 hours. Each run reports the delta since the previous brief.
    - cron: '4 11,23 * * *'

# Serialised against the feed-refresh job so two runs never deploy at once.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # A late scheduled run right after the 7 am brief would only cost a second
  # model call for the same news: skip it. A run started by hand always goes.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.age.outputs.run }}
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: latest-brief.json
        sparse-checkout-cone-mode: false
    - id: age
      run: |
        if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json, datetime
        try:
            t = datetime.datetime.fromisoformat(json.load(open('latest-brief.json'))['generated_at'])
            hours = (datetime.datetime.now(datetime.timezone.utc) - t).total_seconds()/3600
        except Exception:
            hours = 99
        print('run=' + ('false' if hours < 8 else 'true'))
        PY
        cat "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    
    steps:
    - uses: actions/checkout@v3
      with:
        # Full history so the rebase-and-retry in the commit step below works.
        fetch-depth: 0
      
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - run: pip install requests websockets
        
    # China MSA articles already read, so each is fetched and translated once
    - uses: actions/cache@v4
      with:
        path: .cache
        key: feeds-cache-${{ github.run_id }}
        restore-keys: feeds-cache-

    - name: Generate brief
      env:
        GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        # Optional. Set this repo secret to get worldwide AIS; without it the
        # naval layer falls back to the keyless regional feed.
        AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        # Collection window, matched to the twice-daily cadence above.
        COLLECTION_WINDOW_HOURS: '12'
        # Searches the model is told it may spend per run. Searches are most of
        # the xAI bill (~2 cents each, results included); see README, "What a run costs".
        SEARCH_BUDGET: '8'
      run: python3 generate_brief_final.py

    # Commit the brief text back to the repo on every run.
    #
    # This is not just for the archive: GitHub automatically disables scheduled
    # workflows after 60 days with no repository activity. Because this workflow
    # only ever published a Pages artifact and never wrote to the repo, the repo
    # went quiet and the schedule was silently switched off on 2026-05-12
    # (state: disabled_inactivity), which is why the site froze on old content.
    # A daily commit keeps the repo active so the cron never expires again.
    #
    # index.html is deliberately NOT committed: it is a build artifact (it once
    # carried GROK_API_KEY, which is why it was kept out of git history; no key
    # is written into it any more). It is rebuilt from latest-brief.json and
    # template.html on every deploy, and can be regenerated locally with
    # `python3 generate_brief_final.py --offline`.
    - name: Commit brief to repository
      run: |
        git config user.name "Trident Bot"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add latest-brief.json archive
        git add history.json 2>/dev/null || true
        if git diff --cached --quiet; then
          echo "No brief changes to commit"
        else
          git commit -m "Intelligence brief $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git push origin HEAD:${{ github.ref_name }} && break
            echo "Push failed (attempt $i); refreshing and retrying"
            git pull --rebase origin ${{ github.ref_name }} || true
            sleep $((i * 5))
          done
        fi

    - uses: actions/configure-pages@v4
        
    - uses: actions/upload-pages-artifact@v3
      with:
        path: .
        
    - name: Deploy to Pages
      uses: actions/deploy-pages@v4

    - name: Feed summary
      if: always()
      run: |
        echo "----- FEED STATUS -----"
        cat assets/feed-status.json 2>/dev/null || echo "(no feed-status.json written)"

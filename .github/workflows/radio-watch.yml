name: Radio Watch

# Real UVB-76 / HFGCS audio for the Signals section; see radio_monitor.py.
# A relay across public KiwiSDR receivers, one 2-minute slice per receiver,
# for RADIO_MINUTES of each half hour. Results go to the radio-data branch,
# replaced on every run so audio never builds up in the repository history.
# Retired on 7 October 2026: the page's live tuner replaced round-the-clock
# recording through other people's receivers. Kept runnable by hand only.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes to watch this run'
        default: '24'

permissions:
  contents: write

concurrency:
  group: radio-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      RADIO_MINUTES: ${{ inputs.minutes || '24' }}
      RADIO_OUT: radio-data/radio
      KIWICLIENT: kiwiclient
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tools
        run: |
          pip install numpy requests
          git clone -q --depth 1 https://github.com/jks-prv/kiwiclient.git kiwiclient
          which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)

      - name: Last run's results
        run: |
          git clone -q --depth 1 --branch radio-data "https://github.com/${{ github.repository }}.git" radio-data \
            || mkdir -p radio-data
          rm -rf radio-data/.git

      - name: Watch
        run: python3 radio_monitor.py

      - name: Publish to the radio-data branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd radio-data
          git init -q
          git checkout -q -b radio-data
          git config user.name "Trident Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Radio watch $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" radio-data

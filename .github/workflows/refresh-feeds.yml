name: Refresh Live Feeds

# The brief itself runs twice a day, but the live layers (aircraft especially)
# are worthless at that age. This job refreshes only the feeds and redeploys.
# It makes no LLM call, so it costs nothing beyond runner minutes, which are
# free on a public repository.
on:
  schedule:
    # Off the :00/:30 marks, when most of GitHub's scheduled jobs (and the
    # sources' other visitors) arrive at once.
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions:
  contents: write     # the intel-data branch, which analysis sessions read
  pages: write
  id-token: write

# Never let a feed refresh and a brief collection deploy to Pages at once.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - run: pip install requests websockets

      # China MSA articles already read, so each is fetched and translated once
      - uses: actions/cache@v4
        with:
          path: .cache
          key: feeds-cache-${{ github.run_id }}
          restore-keys: feeds-cache-

      - name: Refresh feeds
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          # Optional. Set this repo secret to get worldwide AIS; without it the
          # naval layer falls back to the keyless regional feed.
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: python3 generate_brief_final.py --feeds-only

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

      # Everything this refresh gathered, for analysis sessions: the live site
      # is not reachable from them, the repository is. `python3 intel.py`
      # reads it. A failure here never holds up the page.
      - name: Publish data for analysis sessions
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone -q --depth 1 --branch intel-data "https://github.com/${{ github.repository }}.git" intel-prev \
            || mkdir -p intel-prev
          python3 intel.py publish intel-out --prev intel-prev
          cd intel-out
          git init -q
          git checkout -q -b intel-data
          git config user.name "Trident Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Feeds $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" intel-data

      - name: Feed summary
        if: always()
        run: |
          echo "----- SITE URL -----"
          echo "page_url = ${{ steps.deployment.outputs.page_url }}"
          echo "----- FEED STATUS -----"
          cat assets/feed-status.json 2>/dev/null || echo "(no feed-status.json written)"
